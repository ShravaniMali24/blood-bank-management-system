<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodBank - Hospital Registration</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
    <div class="logo">BloodBank</div>
    <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../available-blood.html">Available Blood</a>
        <a href="../donation-camps.html">Donation Camps</a>
        <a href="../login.html">Login</a>
    </div>
</nav>

<section class="form-page">
    <h2>Hospital Registration</h2>

    <div class="form-card">
        <form class="hospital-register-form hospital-form">

            <div class="form-group full-width">
                <label for="hospitalName">Hospital Name</label>
                <input type="text" id="hospitalName" placeholder="e.g. City Care Multispeciality Hospital" required>
            </div>

            <div class="form-group">
                <label for="contactNumber">Contact Number</label>
                <input type="tel" id="contactNumber" pattern="[0-9]{10}" placeholder="10-digit phone number" required>
            </div>

            <div class="form-group">
                <label for="email">Official Email</label>
                <input type="email" id="email" placeholder="contact@hospital.org" required>
            </div>

            <div class="form-group full-width">
                <label for="street">Street Address</label>
                <input type="text" id="street" placeholder="Building, Street, Landmark" required>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="e.g. Pune" required>
            </div>

            <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state" placeholder="e.g. Maharashtra" required>
            </div>

            <div class="form-group">
                <label for="pin">PIN Code</label>
                <input type="text" id="pin" pattern="[0-9]{6}" placeholder="6-digit PIN" required>
            </div>

            <button type="submit" class="btn submit-btn">Register Hospital</button>

        </form>

        <p class="login-links" style="text-align: center; margin-top: 20px;">
            Already registered? <a href="../login.html">Login to Hospital Portal</a>
        </p>
    </div>
</section>

<script src="../js/main.js"></script>
</body>
</html>
