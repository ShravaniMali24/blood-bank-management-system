<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BloodBank - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <div class="logo">BloodBank</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="available-blood.html">Available Blood</a>
        <a href="donation-camps.html">Donation Camps</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<section class="login-wrap">
    <div class="login-card">
        <h2>Login</h2>

        <div class="tabs">
            <button class="tab active">Donor</button>
            <button class="tab">Hospital</button>
            <button class="tab">Admin</button>
        </div>

        <form>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit" class="btn login-btn">Login</button>
        </form>

        <p class="login-links">New donor? <a href="donor/register.html">Register here</a></p>
    </div>
</section>

<script src="js/main.js"></script>
</body>
</html>
