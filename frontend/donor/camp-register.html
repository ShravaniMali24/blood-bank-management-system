<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BloodBank - Camp Registration</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="dashboard-layout">

    <aside class="sidebar">
        <div class="logo">BloodBank</div>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">My Profile</a>
        <a href="camp-register.html" class="active">Camp Registrations</a>
        <a href="history.html">Donation History</a>
        <a href="../login.html">Logout</a>
    </aside>

    <main class="dashboard-main">
        <h2>Camp Registration</h2>

        <div class="camp-detail-box">
            <h3>Blood Donation Camp 1-1</h3>
            <p>Organizer: Red Cross</p>
            <p>Date: 16 Aug 2026 | Time: 9:00 - 16:00</p>
            <p>Venue: Community Hall 1, Pune</p>
        </div>

        <button class="btn confirm-btn">Confirm Registration</button>

        <section class="my-camps">
            <h3>My Registered Camps</h3>
            <div class="camp-row">
                <span>Camp 1-1 - Pune</span>
                <span class="status registered">Registered</span>
            </div>
            <div class="camp-row">
                <span>Camp 6-2 - Pune</span>
                <span class="status attended">Attended</span>
            </div>
        </section>
    </main>

</div>

<script src="../js/main.js"></script>
</body>
</html>
