<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BloodBank - My Profile</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="dashboard-layout">

    <aside class="sidebar">
        <div class="logo">BloodBank</div>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html" class="active">My Profile</a>
        <a href="camps.html">Camp Registrations</a>
        <a href="#">Donation History</a>
        <a href="../login.html">Logout</a>
    </aside>

    <main class="dashboard-main">
        <h2>My Profile</h2>

        <div class="profile-grid">
            <div class="profile-field">
                <p>Full Name</p>
                <h4>Aarav Sharma</h4>
            </div>
            <div class="profile-field">
                <p>Blood Group</p>
                <h4>O+</h4>
            </div>
            <div class="profile-field">
                <p>Phone</p>
                <h4>9876510000</h4>
            </div>
            <div class="profile-field">
                <p>Email</p>
                <h4>donor1@example.com</h4>
            </div>
            <div class="profile-field">
                <p>City</p>
                <h4>Pune</h4>
            </div>
            <div class="profile-field">
                <p>Weight</p>
                <h4>50.0 kg</h4>
            </div>
            <div class="profile-field readonly">
                <p>Eligibility Status</p>
                <h4>Not Eligible</h4>
            </div>
            <div class="profile-field readonly">
                <p>Last Donation Date</p>
                <h4>-</h4>
            </div>
        </div>

        <button class="btn edit-btn">Edit Profile</button>
    </main>

</div>

<script src="../js/main.js"></script>
</body>
</html>
