<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BloodBank - Donor Registration</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
    <div class="logo">BloodBank</div>
</nav>

<section class="form-page">
    <h2>Donor Registration</h2>

    <form class="donor-form">

        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" required>
        </div>

        <div class="form-group">
            <label for="middleName">Middle Name</label>
            <input type="text" id="middleName">
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" required>
        </div>

        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>
        </div>

        <div class="form-group">
            <label for="bloodGroup">Blood Group</label>
            <select id="bloodGroup" required>
                <option value="">Select</option>
                <option>O+</option>
                <option>O-</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="house">House</label>
            <input type="text" id="house" required>
        </div>

        <div class="form-group">
            <label for="street">Street</label>
            <input type="text" id="street" required>
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" required>
        </div>

        <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state" required>
        </div>

        <div class="form-group">
            <label for="pin">PIN Code</label>
            <input type="text" id="pin" pattern="[0-9]{6}" required>
        </div>

        <div class="form-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" step="0.01">
        </div>

        <button type="submit" class="btn submit-btn">Submit Registration</button>

    </form>
</section>

<script src="../js/main.js"></script>
</body>
</html>
